<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Static SEO meta tags for crawlers and link previews -->
    <title>Fishy Delishy - Fish and Chips Table Bookings in Northill</title>
    <meta name="description" content="Book your table at Fishy Delishy in Northill. The best fish and chips with easy online table reservations." />
    <meta name="keywords" content="fish and chips, restaurant, booking, table reservation, northill, fishy delishy" />
    <meta name="author" content="Fishy Delishy" />
    
    <!-- Open Graph tags -->
    <meta property="og:title" content="Fishy Delishy - Fish and Chips Table Bookings in Northill" />
    <meta property="og:description" content="Book your table at Fishy Delishy in Northill. The best fish and chips with easy online table reservations." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tablepilot.co.uk/fishydelishy/" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    
    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@tablepilot" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    
    <!-- Favicon -->
    <link rel="icon" href="/brand/favicon.ico" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Custom styles for the chat widget to make it less intrusive -->
    <style>
      /* Position the chat widget in a better location */
      elevenlabs-convai {
        position: fixed !important;
        bottom: 20px !important;
        right: 20px !important;
        z-index: 100 !important;
      }
      
      /* Make the widget smaller when collapsed */
      .convai-widget-button {
        transform: scale(0.85) !important;
      }
      
      /* Hide the widget on smaller screens where it might get in the way */
      @media (max-width: 768px) {
        elevenlabs-convai {
          bottom: 10px !important;
          right: 10px !important;
        }
        .convai-widget-button {
          transform: scale(0.75) !important;
        }
      }
      
      /* Add a media query to hide the widget on very small screens */
      @media (max-width: 480px) {
        elevenlabs-convai:not(.convai-widget-expanded) {
          opacity: 0.7 !important;
        }
      }
    </style>
    
    <!-- ElevenLabs widget is dynamically loaded in src/main.tsx based on config -->
    <div id="elevenlabs-widget-container"></div>
  </body>
</html>
