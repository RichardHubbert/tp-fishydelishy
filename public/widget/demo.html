<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Restaurant booking card</title>
    <style>
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: #f6f3ee;
        color: #1f2937;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 48px 20px;
        display: grid;
        grid-template-columns: 1fr minmax(280px, 420px);
        gap: 40px;
        align-items: start;
      }
      h1 { font-size: 2.4rem; margin: 0 0 12px; }
      p { line-height: 1.6; }
      pre {
        white-space: pre-wrap;
        background: #111827;
        color: #f9fafb;
        border-radius: 12px;
        padding: 16px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
      }
      @media (max-width: 800px) {
        main { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Restaurant directory</h1>
        <p>The booking card sits in the page. Paste the same two lines into the directory or any other site.</p>
        <pre>&lt;script src="https://tablepilot.co.uk/yourrestaurant/widget/tp-core-card.js"&gt;&lt;/script&gt;
&lt;tp-core-card restaurant-id="6ef14a92-f49f-4f4f-a596-ee6b91295e5b"&gt;&lt;/tp-core-card&gt;</pre>
      </section>
      <tp-core-card restaurant-id="6ef14a92-f49f-4f4f-a596-ee6b91295e5b"></tp-core-card>
    </main>
    <script src="./tp-core-card.js"></script>
  </body>
</html>
